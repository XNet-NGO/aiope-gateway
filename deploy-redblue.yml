---
- name: XNet Gateway - Red/Blue Container Deploy
  hosts: all
  become: yes
  vars:
    image_name: aiope-gateway
    data_dir: /opt/gateway/data
    blue_port: 8082
    red_port: 8083
    active_color: "{{ lookup('file', '/opt/gateway/active-color', errors='ignore') | default('blue', true) }}"
    deploy_color: "{{ 'red' if active_color == 'blue' else 'blue' }}"
    deploy_port: "{{ red_port if deploy_color == 'red' else blue_port }}"

  tasks:
    - name: Deploy plan
      debug:
        msg: "Deploying {{ deploy_color }} on port {{ deploy_port }} (active: {{ active_color }})"

    - name: Ensure data dir
      file:
        path: "{{ data_dir }}"
        state: directory
        owner: ubuntu

    - name: Copy build context
      synchronize:
        src: ./
        dest: /opt/gateway/build-context/
        rsync_opts:
          - "--include=Dockerfile"
          - "--include=build/***"
          - "--exclude=*"

    - name: Build image
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ deploy_color }}"
        source: build
        build:
          path: /opt/gateway/build-context
        force_source: yes

    - name: Stop old deploy container if exists
      community.docker.docker_container:
        name: "gateway-{{ deploy_color }}"
        state: absent
      ignore_errors: yes

    - name: Start {{ deploy_color }} container
      community.docker.docker_container:
        name: "gateway-{{ deploy_color }}"
        image: "{{ image_name }}:{{ deploy_color }}"
        command: ["{{ deploy_port }}", "/opt/gateway/data"]
        network_mode: host
        volumes:
          - "{{ data_dir }}:/opt/gateway/data"
        restart_policy: unless-stopped
        state: started

    - name: Health check
      uri:
        url: "http://127.0.0.1:{{ deploy_port }}/health"
        status_code: 200
      retries: 10
      delay: 2
      register: health
      until: health.status == 200

    - name: Swap Caddy to {{ deploy_color }}
      shell: |
        sed -i 's/reverse_proxy 127.0.0.1:808[0-9]/reverse_proxy 127.0.0.1:{{ deploy_port }}/' /tmp/caddy-etc/Caddyfile
        docker restart caddy

    - name: Record active color
      copy:
        dest: /opt/gateway/active-color
        content: "{{ deploy_color }}"

    - name: Stop old {{ active_color }} container
      community.docker.docker_container:
        name: "gateway-{{ active_color }}"
        state: stopped
      ignore_errors: yes

    - name: Verify
      uri:
        url: "https://inf.xnet.ngo/health"
        status_code: 200
      register: final

    - name: Done
      debug:
        msg: "✅ {{ deploy_color }} live on port {{ deploy_port }}. {{ final.json }}"
