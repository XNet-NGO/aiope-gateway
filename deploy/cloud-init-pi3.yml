#cloud-config

hostname: aiope-gw
manage_etc_hosts: true

users:
  - name: aiope
    groups: sudo, netdev
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    # password: aiope
    passwd: $6$nhp6Ynxp1DQdej1r$moZFXk40ivloZEmOvhDvO.ky8hK7WzdpFONMX.PvzIFQEDpLrgaBnLjLcvzmH.gWfP3hYkMe0zIEGqhi/Eo9i0

ssh_pwauth: true

package_update: true
package_upgrade: false
packages:
  - openjdk-21-jre-headless
  - certbot
  - python3-certbot-dns-cloudflare
  - python3-certbot-dns-route53
  - python3-certbot-dns-google
  - avahi-daemon
  - network-manager
  - ttyd
  - curl

write_files:
  - path: /etc/systemd/system/aiope-gateway.service
    content: |
      [Unit]
      Description=AIOPE Gateway
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=simple
      User=aiope
      ExecStart=/usr/bin/java -Xmx256m -jar /opt/gateway/gateway.jar 8082 /opt/gateway/data
      WorkingDirectory=/opt/gateway
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/aiope-shell.service
    content: |
      [Unit]
      Description=AIOPE Web Shell
      After=network-online.target
      [Service]
      Type=simple
      ExecStart=/usr/bin/ttyd -p 7681 -W -t fontSize=14 -t theme={"background":"#121212","foreground":"#e0e0e0"} /bin/bash
      Restart=always
      [Install]
      WantedBy=multi-user.target

  - path: /etc/NetworkManager/NetworkManager.conf
    content: |
      [main]
      plugins=ifupdown,keyfile
      [ifupdown]
      managed=true

  - path: /etc/ssh/sshd_config.d/gateway.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication yes

  - path: /etc/motd
    content: |
      =============================================
       AIOPE Gateway Appliance
       Portal: http://aiope-gw.local:8082
       Shell:  http://aiope-gw.local:7681
       SSH:    aiope / aiope
       API:    aiope-gateway-key
      =============================================

runcmd:
  - mkdir -p /opt/gateway/data
  - chown -R aiope:aiope /opt/gateway
  - systemctl enable --now ssh
  - systemctl enable --now NetworkManager
  - systemctl enable --now avahi-daemon
  - systemctl enable --now aiope-gateway
  - systemctl enable --now aiope-shell
