#cloud-config

hostname: aiope-gateway
manage_etc_hosts: true

users:
  - name: aiope
    groups: sudo, netdev
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    # default password: aiope (change on first login)
    passwd: $6$rounds=4096$salt$YjQ4ZDk3ZjE2NzRhMjk0ZGE5ZjE2NzRhMjk0ZA==

package_update: true
packages:
  - docker.io
  - docker-compose
  - network-manager
  - avahi-daemon

write_files:
  - path: /opt/gateway/docker-compose.yml
    content: |
      version: '3'
      services:
        gateway:
          image: ghcr.io/xnet-admin-1/aiope-gateway:latest
          restart: unless-stopped
          network_mode: host
          volumes:
            - /opt/gateway/data:/opt/gateway/data
            - /etc/letsencrypt:/etc/letsencrypt
          environment:
            - GATEWAY_PORT=8082
            - TTYD_PORT=7681

  - path: /etc/NetworkManager/NetworkManager.conf
    content: |
      [main]
      plugins=ifupdown,keyfile
      [ifupdown]
      managed=true

runcmd:
  - systemctl enable --now NetworkManager
  - systemctl enable --now avahi-daemon
  - systemctl enable --now docker
  - mkdir -p /opt/gateway/data /etc/letsencrypt
  - cd /opt/gateway && docker compose pull && docker compose up -d
  - echo "AIOPE Gateway ready at http://$(hostname -I | awk '{print $1}'):8082"
